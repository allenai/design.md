name: Release

# Manual: cutting a version is a deliberate act, not something an ordinary merge
# should trigger. Bump `version` in package.json, merge that, then run this.
#
# It tags the commit and creates a GitHub release, which is what makes a version
# installable — `npm install "github:allenai/design.md#semver:^0.1.0"` resolves
# against those tags. It also publishes to npm when an NPM_AUTH_TOKEN exists.
on:
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    # `if:` can read env but not secrets, so the token's presence is surfaced here
    # for the two steps that branch on whether npm publishing is set up yet.
    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 bundles npm 10, and trusted publishing needs 11.5.1+. Installing
      # it now means switching this workflow off the long-lived NPM_AUTH_TOKEN is
      # a setting on npmjs.com rather than another change here: the OIDC
      # credential it would use is short-lived and scoped to this workflow, and
      # `id-token: write` above is already granted for provenance.
      - run: npm install -g npm@11

      - run: npm ci

      # Nobody should need a toolchain on their machine to cut a release: a spec edited in
      # the browser leaves the composed DESIGN.md and tokens.json behind, so the
      # release rebuilds them and commits the result before tagging. This also
      # makes a hand-edited generated file harmless — it gets overwritten rather
      # than shipped, which is what the old staleness check was protecting against.
      - name: Rebuild generated files
        run: npm run build

      - name: Commit anything that changed
        run: |
          if git diff --quiet -- '*/DESIGN.md' 'olmo-earth/tokens.json'; then
            echo "::notice::Generated files were already up to date."
            exit 0
          fi
          git --no-pager diff --stat -- '*/DESIGN.md' 'olmo-earth/tokens.json'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/DESIGN.md' 'olmo-earth/tokens.json'
          git commit -m "chore: rebuild generated files for v$(node -p "require('./package.json').version")"
          git push

      - name: Lint specs
        run: npm run lint

      - name: Read package identity
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Makes a re-run harmless rather than a hard failure on an already-taken
      # version.
      - name: Check whether this version is already on npm
        id: exists
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published — skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.published == 'false' && env.NPM_AUTH_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Note that npm was skipped
        if: env.NPM_AUTH_TOKEN == ''
        run: |
          echo "::notice::No NPM_AUTH_TOKEN, so nothing was published to npm. \
          Tagging anyway — consumers can install this version straight from git \
          with 'github:allenai/design.md#semver:^${{ steps.pkg.outputs.version }}'."

      # Tagging is deliberately not gated on npm. A git tag is what makes a
      # version installable and resolvable by semver without a registry, so it
      # has to happen whether or not publishing is available.
      - name: Tag and create a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
